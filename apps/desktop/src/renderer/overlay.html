<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Professor Agent Overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: avatar:; connect-src 'self' data: blob: avatar:"

      html,
      body {

        width: 100%;
        height: 100%;

  <body>
    <canvas id="stage"></canvas>
    <script type="module" src="/src/overlay/main.ts"></script>
