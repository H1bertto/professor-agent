<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Professor Agent Overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: avatar:; connect-src 'self' data: blob: avatar:"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage,
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      body.interactive #stage {
        cursor: grab;
      }
      body.dragging #stage {
        cursor: grabbing;
      }
      /* The microphone is open in conversation mode. */
      .mic {
        position: absolute;
        top: 8px;
        right: 8px;
        width: 10px;
        height: 10px;
        border: 2px solid rgba(255, 255, 255, 0.85);
        border-radius: 50%;
        background: #cf222e;
        pointer-events: none;
      }
      .mic[hidden] {
        display: none;
      }
      .error {
        margin: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(207, 34, 46, 0.9);
        color: #fff;
        font:
          13px system-ui,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="stage"></div>
    <div id="mic" class="mic" hidden title="The teacher is listening"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
