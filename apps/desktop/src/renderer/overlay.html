<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Professor Agent Overlay</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: avatar:; connect-src 'self' data: blob: avatar:"
    />
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        user-select: none;
      }
      #stage,
      #stage canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .error {
        margin: 12px;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(207, 34, 46, 0.9);
        color: #fff;
        font:
          13px system-ui,
          sans-serif;
      }
    </style>
  </head>

  <body>
    <div id="stage"></div>
    <script type="module" src="/src/overlay/main.ts"></script>
  </body>
</html>
