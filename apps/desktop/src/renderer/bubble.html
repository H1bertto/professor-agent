<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Professor Agent answer</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: rgba(255, 255, 255, 0.97);
        --border: #d0d7de;
        --text: #1f2328;
        --muted: #59636e;
        --accent: #2f6fdb;
        --error: #cf222e;
        font:
          14px system-ui,
          'Segoe UI',
          sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: rgba(31, 35, 41, 0.97);
          --border: #3d444d;
          --text: #e6edf3;
          --muted: #9198a1;
          --accent: #5b93f0;
          --error: #f85149;
        }
      }
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        user-select: none;
      }
      /* The window takes the height of the bubble, up to BUBBLE_MAX_HEIGHT in window-bounds.ts. */
      .bubble {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 360px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg);
        color: var(--text);
      }
      .bubble[hidden] {
        display: none;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .actions {
        display: flex;
        gap: 4px;
      }
      button {
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .question {
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
      .text {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
        line-height: 1.45;
        white-space: pre-wrap;
        user-select: text;
      }
      .text:empty {
        display: none;
      }
      /* Words in the language the student practices stand out. */
      .text [lang] {
        color: var(--accent);
        font-weight: 600;
      }
      .status {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
      }
      .status.error {
        color: var(--error);
        font-size: 13px;
      }
      .status.thinking {
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }
    </style>
  </head>

  <body>
    <article id="bubble" class="bubble" hidden>
      <header>
        <strong id="teacher"></strong>
        <div class="actions">
          <button id="stop" type="button" hidden>Stop</button>
          <button id="pin" type="button" aria-pressed="false" title="Keep the answer on screen">
            Pin
          </button>
          <button id="close" type="button" aria-label="Close">&times;</button>
        </div>
      </header>
      <p id="question" class="question"></p>
      <div id="text" class="text"></div>
      <p id="status" class="status" role="status" hidden></p>
    </article>
    <script type="module" src="/src/bubble/main.ts"></script>
  </body>
</html>
